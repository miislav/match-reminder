name: Match podsjetnik

on:
  schedule:
    - cron: "*/15 * * * *"   # rezerva: ako se lanac ikad prekine, ovo ga ponovno pokrene
  workflow_dispatch:
    inputs:
      test:
        description: "Pošalji testne poruke u Slack"
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

# Uvijek radi samo jedna "smjena" bota (sprječava duple poruke)
concurrency:
  group: match-reminder
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Učitaj popis već poslanih obavijesti
        uses: actions/cache/restore@v4
        with:
          path: sent.json
          key: sent-${{ github.run_id }}
          restore-keys: sent-

      - name: Provjeri utakmice
        run: python3 sevilla_bot.py
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEST: ${{ inputs.test }}

      - name: Spremi popis poslanih obavijesti
        if: ${{ always() && !inputs.test }}
        uses: actions/cache/save@v4
        with:
          path: sent.json
          key: sent-${{ github.run_id }}

      - name: Pokreni sljedeću smjenu
        if: ${{ success() && !inputs.test }}
        run: gh workflow run sevilla.yml --repo "${{ github.repository }}" -f test=false
        env:
          GH_TOKEN: ${{ github.token }}
